<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<!-- styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font_stylesheet.css') }}" type="text/css" charset="utf-8" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylesheet.css') }}" type="text/css" charset="utf-8" />
    <style type="text/css">
        body{
            font-family: "london_undergroundregular";
            }
     </style>
<!-- /styles -->

<!-- favicons -->
<!-- https://realfavicongenerator.net/ -->
<link rel="shortcut icon" href="{{ url_for('static', filename='ico/favicon.ico') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='ico/apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='ico/favicon-32x32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='ico/favicon-16x16.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='ico/site.webmanifest') }}">
<link rel="mask-icon" href="{{ url_for('static', filename='ico/safari-pinned-tab.svg') }}" color="#5bbad5">
<meta name="msapplication-TileColor" content="#2b5797">
<meta name="theme-color" content="#ffffff">
<!-- /favicons -->

<!-- scripts -->
<!-- /scripts -->

<title>busstop - profiles</title>
</head>
<body >
<div id="container">
<br>
{% if error %}<p id="profile-error">{{ error }}</p>{% endif %}
{% for row in rows %}
<form method="POST">
  <input type="hidden" name="original" value="{{ row.name }}">
  <input type="text" name="name" value="{{ row.name }}" maxlength="40" aria-label="Profile name">
  <input type="text" name="stopids" value="{{ row.stopids }}" aria-label="Stop ids (comma separated)">
  <input type="text" name="num_services" value="{{ row.num_services }}" size="12" aria-label="Services per stop (comma separated)">
  <button type="submit" name="action" value="save">Save</button>
  <button type="submit" name="action" value="delete">Delete</button>
</form>
<br>
{% endfor %}
<form method="POST">
  <input type="text" name="name" placeholder="New profile name" maxlength="40" aria-label="New profile name">
  <input type="text" name="stopids" placeholder="stop ids, comma separated" aria-label="Stop ids">
  <input type="text" name="num_services" placeholder="e.g. 5,5" size="12" aria-label="Services per stop">
  <button type="submit" name="action" value="add">Add profile</button>
</form>
<br>
<span class="back"><a href="{{url_for('index')}}">Back</a></span><br>
</div>
</body>
